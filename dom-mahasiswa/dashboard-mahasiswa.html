<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Mahasiswa</title>
  <link rel="stylesheet" href="dashboard.css">
</head>
<body>

  <div class="sidebar">
    <div class="logo">🎓 EduLearn</div>
    <div class="menu">
      <a class="active">🏠 Beranda</a>
      <a>📚 Kursus Saya</a>
      <a>📝 Tugas</a>
      <a>👤 Profil</a>
      <a>🚪 Logout</a>
    </div>
  </div>

  <div class="main">
    <h3>Selamat Datang, Mahasiswa! 👋</h3>
    <p style="font-size: 13px; color: #64748b;">
      Lanjutkan progres belajar kamu
    </p>
    <br>
    <div class="cards">
      <div class="card">
        <h4>Kursus Diikuti</h4>
        <p>5 Kursus</p>
        <div class="progress">
          <div style="width: 80%"></div>
        </div>
      </div>
      <div class="card">
        <h4>Tugas Selesai</h4>
        <p>12 / 15</p>
        <div class="progress">
          <div style="width: 75%"></div>
        </div>
      </div>
      <div class="card">
        <h4>Nilai</h4>
        <p>88.5</p>
        <div class="progress">
          <div style="width: 88%"></div>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
